[project]
name = "veritas"
version = "1.0.0"
description = "Veritas - a Python package"
authors = [{name = "Your Name", email = "your@email.com"}]
requires-python = ">=3.9"
dynamic = ["optional-dependencies"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
optional-dependencies = {dev = {file = ["dev-requirements.txt"]}} # add packages for development in the dev-requirements.txt file

[project.scripts]
veritas = "veritas.__main__:main"




